name: Internal TLS render checks

on:
  pull_request:
    paths:
      - charts/buildbuddy-enterprise/**
      - scripts/test_internal_tls.py
      - .github/workflows/internal-tls.yaml
  push:
    branches: [master]
    paths:
      - charts/buildbuddy-enterprise/**
      - scripts/test_internal_tls.py
      - .github/workflows/internal-tls.yaml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.19.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Lint default and internal TLS values
        run: |
          helm lint charts/buildbuddy-enterprise
          helm lint charts/buildbuddy-enterprise -f charts/buildbuddy-enterprise/examples/internal-tls.values.yaml
      - name: Check rendered TLS and staged rollout contracts
        run: python scripts/test_internal_tls.py
